[project]
name = "agentic-rag-llamaindex-goodmem"
version = "0.1.0"
description = "LlamaIndex agentic RAG notebooks backed by GoodMem"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "goodmem==0.1.34",
    "httpx>=0.28,<1",
    "llama-index-core==0.14.24",
    "llamaindex-goodmem==0.2.0",
    "llama-index-llms-cohere==0.9.0",
    "llama-index-llms-groq==0.6.1",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
llamaindex-rag = "goodmem_rag.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.12", "nbclient>=0.10", "nbformat>=5.10", "ipykernel>=6.29"]
notebooks = ["jupyterlab>=4.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["goodmem_rag"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
